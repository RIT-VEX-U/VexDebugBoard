; PlatformIO Project Configuration File
; Custom ESP32-C3-WROOM Board - VexDebugBoard 

[env:esp32c3_custom]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Upload settings for FTDI USB chip
upload_speed = 921600
monitor_speed = 115200

; Build flags with pin definitions
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; SD Card SPI pins
    -DSD_MISO=0
    -DSD_MOSI=1
    -DSD_CS=3
    -DSD_CLK=19
    ; RS485 UART pins
    -DRS485_TX=6
    -DRS485_RX=7
    -DRS485_DE=10
    ; LED pins
    -DSTAT_LED=4
    -DDEBUG_LED=18

; Libraries
lib_deps = 
    SPI
    SD
    Links2004/WebSockets

; Extra settings
board_build.flash_mode = dio
board_build.f_flash = 80000000L
